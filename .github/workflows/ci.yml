# CI: roda os testes em todo pull request e em todo push na main.
# Com a proteção de branch ligada, um PR só pode ser mesclado se este job passar.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Testes (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Rodar testes
        run: ./mvnw -B verify
