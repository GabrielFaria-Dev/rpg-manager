# Abre PRs semanais quando houver atualização (inclusive de segurança) nas dependências
# do Maven e nas actions do CI. Cada PR passa pelo CI e pela sua revisão antes de entrar.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
