spring:
  application:
    name: rpg-manager

# Erros nunca expõem detalhes internos ao cliente (boas-praticas.md, seção 4).
# São os padrões do Spring Boot, fixados aqui para ninguém ligar sem perceber.
server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
